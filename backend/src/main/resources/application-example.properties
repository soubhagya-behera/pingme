spring.application.name=pingme-backend

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pingme
spring.datasource.username=postgres
spring.datasource.password="Your_Password"

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# =========================
# SERVER
# =========================
server.port=8080

app.upload.image-directory=uploads/chat-images
app.upload.max-image-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# =========================
# MAIL (We'll configure later)
# =========================
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
