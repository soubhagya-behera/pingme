spring.application.name=pingme-backend

# =========================
# DATABASE CONFIGURATION
# Copy this file to application.properties or set env vars.
# Required env vars for production: DB_PASSWORD, JWT_SECRET, MAIL_PASSWORD, ADMIN_PASSWORD
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pingme
spring.datasource.username=postgres
# Set via env var DB_PASSWORD — never commit real password. Example placeholder:
spring.datasource.password=${DB_PASSWORD:CHANGEME_DB_PASSWORD}

# =========================
# JPA / HIBERNATE — production uses validate + Flyway (do NOT use update)
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================
# SERVER
# =========================
server.port=8080

app.upload.image-directory=uploads/chat-images
app.upload.max-image-size-bytes=10485760
app.upload.file-directory=uploads/chat-files
app.upload.max-file-size-bytes=10485760
app.upload.profile-image-directory=uploads/profile-photos
app.upload.max-profile-image-size-bytes=5242880
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# =========================
# MAIL — set via env vars MAIL_USERNAME / MAIL_PASSWORD
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:CHANGEME_MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# CORS / WEBSOCKET ORIGINS
# ==========================
app.cors.allowed-origins=http://localhost:5173
app.ws.allowed-origins=http://localhost:5173
# Production override: export APP_CORS_ALLOWED_ORIGINS=https://your-domain.com

# ==========================
# RATE LIMITING
# ==========================
app.rate-limit.login=5
app.rate-limit.login-window-seconds=60
app.rate-limit.forgot-password=3
app.rate-limit.forgot-password-window-seconds=60
app.rate-limit.reset-password=5
app.rate-limit.reset-password-window-seconds=60
app.rate-limit.otp=3
app.rate-limit.otp-window-seconds=60
app.rate-limit.chat-send=30
app.rate-limit.chat-send-window-seconds=60

# ==========================
# JWT — MUST be externalized via JWT_SECRET (min 32 chars, base64)
# Generate: openssl rand -base64 32
# ==========================
jwt.secret=${JWT_SECRET:CHANGEME_GENERATE_A_SECURE_RANDOM_BASE64_SECRET_AT_LEAST_32_CHARS}
jwt.expiration=86400000

# ==========================
# ADMIN — password MUST be externalized via ADMIN_PASSWORD
# ==========================
pingme.admin.name=PingMe Administrator
pingme.admin.email=sauvagyabatisahoo@gmail.com
pingme.admin.password=${ADMIN_PASSWORD:CHANGEME_ADMIN_PASSWORD}

# ==========================
# ACTUATOR — health only
# ==========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
